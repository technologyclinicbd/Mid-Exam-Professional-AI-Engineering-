<!DOCTYPE html>

<head>
    <title>Doctor AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #007bff;
            color: white;
            border: none;
        }

        .result {
            margin-top: 20px;
            background: #f1f1f1;
            padding: 20px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Doctor AI Assistant</h1>

    <form method="POST">

        <label for="symptoms">Your Symptoms</label>

        <textarea id="symptoms" name="symptoms" required></textarea>

        <button type="submit">Check Doctor</button>

    </form>

    {% if result %}
    <div class="result">
        {{ result }}
    </div>
    {% endif %}

</div>

</body>
